name: UI Tiberbu CI and GHCR Push

on:
  push:
    branches: [ "demo-tiberbu" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_URI: ghcr.io/${{ github.repository }}
  # Branch-scoped incremental release tags: demo-tiberbu-v1, demo-tiberbu-v2, ... (one new tag per
  # successful build). demo-dev owns v<N> and latest, which the dev deployment pulls.
  VERSION_TAG_PREFIX: demo-tiberbu-v
  LATEST_TAG: demo-tiberbu-latest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Determine next version tag
      id: version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        OWNER="${{ github.repository_owner }}"
        PKG="${{ github.event.repository.name }}"
        PREFIX="${VERSION_TAG_PREFIX}"
        TAGS=$(gh api "/orgs/${OWNER}/packages/container/${PKG}/versions?per_page=100" \
          --jq '.[].metadata.container.tags[]' 2>/dev/null | grep -E "^${PREFIX}[0-9]+$" || true)
        if [ -z "$TAGS" ]; then
          VERSION_TAG="${PREFIX}1"
        else
          MAX_NUM=$(echo "$TAGS" | sed "s/^${PREFIX}//" | sort -n | tail -1)
          VERSION_TAG="${PREFIX}$((MAX_NUM + 1))"
        fi
        echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
        echo "Version tag for this build: ${VERSION_TAG}"

    - name: Build container image
      run: docker build -t ${IMAGE_URI}:${{ steps.version.outputs.version_tag }} .

    - name: Tag image as latest
      run: docker tag ${IMAGE_URI}:${{ steps.version.outputs.version_tag }} ${IMAGE_URI}:${LATEST_TAG}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push version and latest to GHCR
      run: |
        VERSION_TAG="${{ steps.version.outputs.version_tag }}"
        docker push ${IMAGE_URI}:${VERSION_TAG}
        docker push ${IMAGE_URI}:${LATEST_TAG}
